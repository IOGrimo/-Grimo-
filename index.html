<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0612" />
<title>오늘의 운세</title>
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; }

  :root{
    --bg-0:#070510;
    --bg-1:#0d0a1f;
    --bg-2:#120c26;
    --ink:#eae6f5;
    --ink-2:#b8b0d4;
    --ink-3:#7d7596;
    --line:rgba(255,255,255,0.08);
    --line-2:rgba(255,255,255,0.14);
    --glass:rgba(255,255,255,0.04);
    --glass-2:rgba(255,255,255,0.06);
    --gold:#d8b673;
    --gold-soft:#e8d3a0;
    --violet:#9a7bff;
    --indigo:#6b8aff;
    --rose:#e89bb7;
    --shadow:0 24px 60px rgba(0,0,0,0.45);
  }

  html, body{
    margin:0; padding:0;
    background:var(--bg-0);
    color:var(--ink);
    font-family:
      -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Pretendard",
      "Noto Sans KR", "Malgun Gothic", "맑은 고딕",
      "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
    min-height:100dvh;
    letter-spacing:-0.01em;
  }

  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(154,123,255,0.22), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, rgba(107,138,255,0.15), transparent 60%),
      radial-gradient(800px 500px at 50% 110%, rgba(216,182,115,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 60%, var(--bg-0));
    background-attachment: fixed;
  }

  /* Floating particles */
  .bg-particles{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .particle{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,255,255,0.55);
    box-shadow:0 0 8px rgba(255,255,255,0.5);
    opacity:0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(20px) translateX(0); opacity:0; }
    10%{ opacity:0.7; }
    90%{ opacity:0.5; }
    100%{ transform: translateY(-110vh) translateX(20px); opacity:0; }
  }

  /* Slow drifting glow */
  .bg-glow{
    position:fixed; inset:-20%;
    z-index:0; pointer-events:none;
    background:
      radial-gradient(closest-side, rgba(154,123,255,0.18), transparent 70%) 30% 30%/600px 600px no-repeat,
      radial-gradient(closest-side, rgba(216,182,115,0.10), transparent 70%) 70% 60%/700px 700px no-repeat,
      radial-gradient(closest-side, rgba(107,138,255,0.14), transparent 70%) 50% 90%/600px 600px no-repeat;
    filter: blur(20px);
    animation: drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(20px,-15px) scale(1.05); }
    100% { transform: translate(-15px,10px) scale(0.98); }
  }

  /* Layout */
  .app{
    position:relative; z-index:1;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding: max(env(safe-area-inset-top), 18px) 18px max(env(safe-area-inset-bottom), 18px);
    max-width: 720px; margin:0 auto;
  }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 4px 14px;
  }
  .brand{
    font-size: 13px; letter-spacing:0.25em;
    color: var(--ink-3); text-transform: uppercase;
  }
  .mute-btn{
    width:40px; height:40px; border-radius:50%;
    background: var(--glass); border:1px solid var(--line);
    color: var(--ink-2);
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .mute-btn:hover{ background: var(--glass-2); border-color: var(--line-2); }
  .mute-btn:active{ transform: scale(0.94); }

  /* Screens */
  .screen{
    flex:1; display:none; flex-direction:column;
    animation: fadeIn 0.6s ease both;
  }
  .screen.active{ display:flex; }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* Hero */
  .hero{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 24px 8px 32px;
    gap: 28px;
  }
  .hero-title{
    font-size: clamp(34px, 8vw, 48px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin:0;
    background: linear-gradient(180deg, #ffffff 0%, #cfc7e6 100%);
    -webkit-background-clip:text; background-clip:text;
    color: transparent;
    text-shadow: 0 1px 0 rgba(255,255,255,0.04);
  }
  .hero-sub{
    color: var(--ink-2);
    font-size: 14.5px;
    line-height: 1.75;
    max-width: 420px;
    margin:0 auto;
    font-weight: 400;
  }

  /* Orb */
  .orb-wrap{
    position:relative;
    width: min(260px, 62vw); aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    margin: 8px 0;
  }
  .orb{
    position:absolute; inset:18%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #ffffff 0%, rgba(255,255,255,0.65) 12%, rgba(216,182,115,0.55) 30%, rgba(154,123,255,0.45) 55%, rgba(20,15,40,0.95) 85%);
    box-shadow:
      0 0 60px rgba(154,123,255,0.45),
      0 0 120px rgba(216,182,115,0.25),
      inset 0 0 40px rgba(255,255,255,0.15);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); filter: brightness(1); }
    50%   { transform: scale(1.05); filter: brightness(1.1); }
  }
  .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.10);
    animation: spin 18s linear infinite;
  }
  .ring.r2{ inset:8%; border-color: rgba(216,182,115,0.18); animation-duration: 26s; animation-direction: reverse; }
  .ring.r3{ inset:-6%; border-color: rgba(154,123,255,0.14); animation-duration: 34s; }
  .ring::before{
    content:""; position:absolute; top:-2px; left:50%; transform: translateX(-50%);
    width:4px; height:4px; border-radius:50%;
    background:#ffffff; box-shadow:0 0 10px #fff;
  }
  @keyframes spin{ to { transform: rotate(360deg); } }

  /* Buttons */
  .btn{
    appearance:none;
    border:1px solid var(--line-2);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: var(--ink);
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
    padding: 16px 26px;
    border-radius: 14px;
    cursor:pointer;
    min-height: 52px;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
    width:100%;
    max-width: 340px;
  }
  .btn:hover{ background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04)); border-color: rgba(255,255,255,0.22); }
  .btn:active{ transform: scale(0.985); }
  .btn-primary{
    background: linear-gradient(180deg, rgba(216,182,115,0.95), rgba(184,148,82,0.95));
    border-color: rgba(232,211,160,0.6);
    color:#1a1306;
    box-shadow:
      0 10px 30px rgba(216,182,115,0.30),
      inset 0 1px 0 rgba(255,255,255,0.4);
    font-weight: 600;
  }
  .btn-primary:hover{
    background: linear-gradient(180deg, rgba(232,200,135,1), rgba(200,162,90,1));
    border-color: rgba(232,211,160,0.8);
  }
  .btn-ghost{
    background: transparent;
    border:1px solid var(--line);
    color: var(--ink-2);
  }
  .btn-row{
    display:flex; gap:10px; width:100%; max-width: 520px; margin: 0 auto;
  }
  .btn-row .btn{ flex:1; }

  /* Form */
  .form-wrap{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding: 20px 4px 40px;
    gap: 26px;
  }
  .form-card{
    width:100%;
    background: var(--glass);
    border:1px solid var(--line);
    border-radius: 22px;
    padding: 26px 22px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .form-title{
    font-size: 20px; font-weight:600; margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .form-desc{
    color: var(--ink-2); font-size:13.5px; line-height:1.7;
    margin:0 0 22px;
  }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block; font-size: 13px; font-weight:500;
    color: var(--ink-2); margin-bottom: 8px; letter-spacing: 0.02em;
  }
  .input{
    width:100%;
    background: rgba(0,0,0,0.25);
    border:1px solid var(--line);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px; /* prevents iOS zoom */
    padding: 14px 16px;
    border-radius: 12px;
    outline:none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .input::placeholder{ color: var(--ink-3); }
  .input:focus{
    border-color: rgba(216,182,115,0.55);
    background: rgba(0,0,0,0.35);
    box-shadow: 0 0 0 4px rgba(216,182,115,0.10);
  }
  .input[type="date"]{ color: var(--ink); }
  .input[type="date"]::-webkit-calendar-picker-indicator{
    filter: invert(0.8) sepia(0.4) saturate(0.6) hue-rotate(8deg);
    opacity: 0.8; cursor: pointer;
  }
  .gender-group{
    display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;
  }
  .gender-opt{
    position:relative;
  }
  .gender-opt input{
    position:absolute; opacity:0; pointer-events:none;
  }
  .gender-opt label{
    display:flex; align-items:center; justify-content:center;
    padding: 12px 8px;
    border:1px solid var(--line);
    border-radius: 11px;
    color: var(--ink-2);
    font-size: 14px;
    cursor:pointer;
    background: rgba(0,0,0,0.20);
    transition: all .2s ease;
    margin-bottom: 0;
    text-align:center;
  }
  .gender-opt input:checked + label{
    border-color: rgba(216,182,115,0.6);
    background: rgba(216,182,115,0.12);
    color: var(--gold-soft);
  }
  .warn{
    font-size: 12.5px; color:#ff9bb5; margin-top: 6px; min-height: 16px;
  }
  .disclaimer{
    color: var(--ink-3); font-size: 12px; text-align:center;
    line-height:1.7; padding: 0 8px;
  }

  /* Loading */
  .loading-wrap{
    position: fixed; inset:0; z-index: 50;
    display: none; align-items:center; justify-content:center; flex-direction:column;
    background: rgba(5,3,12,0.78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    text-align:center;
    padding: 24px;
  }
  .loading-wrap.show{ display:flex; animation: fadeIn .5s ease both; }
  .loading-orb{
    position:relative; width:160px; height:160px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 28px;
  }
  .loading-orb .orb{ position:absolute; inset:25%; }
  .loading-text{
    color: var(--ink-2); font-size: 14.5px; letter-spacing: 0.04em;
    opacity:0.95; transition: opacity .6s ease;
    min-height: 22px;
  }

  /* Result */
  .result-wrap{
    display:flex; flex-direction:column; gap:14px;
    padding: 16px 0 40px;
  }
  .result-header{
    text-align:center; padding: 26px 8px 8px;
    position:relative;
  }
  .result-header h2{
    font-size: 22px; font-weight: 600; margin: 0 0 6px;
    letter-spacing:-0.02em;
  }
  .result-header p{
    color: var(--ink-2); font-size: 13.5px; line-height:1.7; margin:0;
  }
  .burst{
    position:absolute; left:50%; top:0;
    width:200px; height:200px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(216,182,115,0.45) 0%, rgba(154,123,255,0.20) 30%, transparent 70%);
    border-radius:50%;
    animation: burstAnim 1.2s ease-out forwards;
    pointer-events:none;
    opacity: 0;
  }
  @keyframes burstAnim{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(0.2); }
    40%{ opacity: 1; }
    100%{ opacity:0; transform: translate(-50%,-50%) scale(2.4); }
  }

  .card{
    background: var(--glass);
    border:1px solid var(--line);
    border-radius: 18px;
    padding: 20px 20px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 14px 36px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.04);
    opacity:0; transform: translateY(14px) scale(0.96);
    animation: cardIn .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes cardIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .card-head{
    display:flex; align-items:center; gap: 10px;
    margin-bottom: 12px;
  }
  .card-tag{
    font-size: 11px; letter-spacing: 0.2em;
    color: var(--gold-soft); text-transform: uppercase;
    padding: 4px 10px;
    border:1px solid rgba(216,182,115,0.3);
    border-radius: 100px;
    background: rgba(216,182,115,0.06);
  }
  .card-title{
    font-size: 17px; font-weight:600; margin:0;
    letter-spacing:-0.01em;
  }
  .card-body{
    color: var(--ink-2);
    font-size: 14.5px;
    line-height: 1.85;
    letter-spacing: -0.005em;
  }
  .card-body strong{ color: var(--ink); font-weight: 600; }

  /* Score */
  .score-block{
    display:flex; align-items:center; gap:18px; margin: 6px 0 14px;
  }
  .score-circle{
    position:relative;
    width: 78px; height: 78px; flex-shrink:0;
  }
  .score-circle svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .score-circle .ring-bg{ stroke: rgba(255,255,255,0.08); }
  .score-circle .ring-fg{
    stroke: url(#scoreGrad);
    stroke-linecap: round;
    transition: stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1);
  }
  .score-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 22px; font-weight:600; color: var(--ink);
    letter-spacing:-0.02em;
  }
  .score-label{
    font-size: 13px; color: var(--ink-3); margin-bottom: 4px; letter-spacing: 0.06em;
  }
  .score-desc{
    font-size: 14px; color: var(--ink-2); line-height:1.65;
  }

  /* Keywords */
  .kw-list{ display:flex; flex-direction:column; gap: 12px; margin-top: 4px; }
  .kw-item{
    display:flex; gap: 14px; align-items:flex-start;
    padding: 14px; border-radius: 14px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line);
  }
  .kw-word{
    flex-shrink:0;
    font-size: 15px; font-weight: 600;
    color: var(--gold-soft);
    padding: 6px 12px;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(216,182,115,0.18), rgba(216,182,115,0.06));
    border:1px solid rgba(216,182,115,0.3);
    box-shadow: 0 0 18px rgba(216,182,115,0.18);
    min-width: 64px; text-align:center;
    animation: kwGlow 2.6s ease-in-out infinite;
  }
  @keyframes kwGlow{
    0%,100%{ box-shadow: 0 0 14px rgba(216,182,115,0.18); }
    50%   { box-shadow: 0 0 24px rgba(216,182,115,0.35); }
  }
  .kw-desc{
    font-size: 14px; color: var(--ink-2); line-height:1.7;
    padding-top: 6px;
  }

  /* Number / Color blocks */
  .pill-row{
    display:grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .pill{
    text-align:center; padding: 18px 14px;
    background: rgba(255,255,255,0.025);
    border:1px solid var(--line); border-radius: 14px;
  }
  .pill-label{
    font-size: 11px; letter-spacing: 0.2em;
    color: var(--ink-3); text-transform: uppercase; margin-bottom: 10px;
  }
  .pill-value{
    font-size: 28px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.02em;
  }
  .color-swatch{
    width: 36px; height: 36px; border-radius: 50%;
    margin: 4px auto 8px;
    box-shadow: 0 0 22px currentColor, inset 0 1px 0 rgba(255,255,255,0.3);
    border:1px solid rgba(255,255,255,0.2);
  }
  .pill-value-color{
    font-size: 17px; font-weight:600; color: var(--ink);
  }
  .pill-desc{
    margin-top: 8px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6;
  }

  /* One line message */
  .one-liner{
    text-align:center; padding: 28px 24px;
    border: 1px solid rgba(216,182,115,0.25);
    background:
      radial-gradient(closest-side at 50% 0%, rgba(216,182,115,0.10), transparent 70%),
      var(--glass);
    border-radius: 18px;
    font-size: 16px; line-height: 1.85;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .one-liner::before{
    content:"〝"; display:block; font-size: 32px; color: var(--gold-soft);
    line-height: 1; opacity: 0.7; margin-bottom: 6px;
  }
  .one-liner::after{
    content:"〞"; display:block; font-size: 32px; color: var(--gold-soft);
    line-height: 1; opacity: 0.7; margin-top: 4px;
  }

  /* CTA section */
  .cta-section{
    margin-top: 18px; padding: 26px 22px;
    border-radius: 22px;
    background:
      radial-gradient(closest-side at 50% 0%, rgba(154,123,255,0.16), transparent 70%),
      var(--glass);
    border:1px solid var(--line);
    text-align:center;
  }
  .cta-section h3{
    margin: 0 0 8px; font-size: 17px; font-weight:600;
    letter-spacing:-0.01em;
  }
  .cta-section p{
    margin: 0 0 18px; color: var(--ink-2); font-size: 13.5px; line-height: 1.7;
  }
  .cta-btn{
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    padding: 16px 22px;
    border-radius: 14px;
    font-size: 15px; font-weight: 600;
    letter-spacing:-0.005em;
    margin: 0 auto 10px;
    max-width: 340px;
    transition: transform .15s ease, box-shadow .2s ease;
    min-height: 52px;
  }
  .cta-btn:active{ transform: scale(0.985); }
  .cta-main{
    background: linear-gradient(180deg, rgba(216,182,115,0.95), rgba(184,148,82,0.95));
    color:#1a1306;
    box-shadow:
      0 10px 30px rgba(216,182,115,0.30),
      inset 0 1px 0 rgba(255,255,255,0.4);
    border:1px solid rgba(232,211,160,0.6);
  }
  .cta-insta{
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    color: var(--ink);
    border:1px solid var(--line-2);
  }

  .actions-row{
    display:flex; gap:10px; margin-top: 8px;
  }
  .actions-row .btn{ flex:1; }

  .foot{
    text-align:center; color: var(--ink-3);
    font-size: 11.5px; padding: 18px 6px 6px;
    letter-spacing: 0.04em;
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .orb{ animation: none; }
    .ring{ animation: none; }
    .bg-glow{ animation: none; }
    .particle{ display:none; }
    .kw-word{ animation: none; }
  }

  /* Small phones */
  @media (max-width: 380px){
    .hero-title{ font-size: 32px; }
    .form-card{ padding: 22px 18px; }
    .card{ padding: 18px 16px; }
    .gender-opt label{ font-size:13px; padding: 11px 6px; }
  }

  /* Larger screens */
  @media (min-width: 720px){
    .app{ padding-top: 28px; }
    .hero{ padding: 44px 0 50px; }
    .orb-wrap{ width: 280px; }
  }
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-particles" id="particles" aria-hidden="true"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">FORTUNE · 오늘의 운세</div>
    <button class="mute-btn" id="muteBtn" aria-label="소리 켜기/끄기" aria-pressed="false" title="소리">

/* ============================================================
   SOUND (Web Audio API) - soft chime / shimmer / bell
   ============================================================ */
const Sound = (() => {
  let ctx = null;
  let muted = false;
  function ensure(){
    if (!ctx){
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function chime(){
    if (muted) return;
    const c = ensure(); if (!c) return;
    const now = c.currentTime;
    const notes = [880, 1320, 1760];
    notes.forEach((f, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i*0.10);
      g.gain.exponentialRampToValueAtTime(0.07, now + i*0.10 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.10 + 0.9);
      o.connect(g).connect(c.destination);
      o.start(now + i*0.10);
      o.stop(now + i*0.10 + 1.0);
    });
  }
  function shimmer(){
    if (muted) return;
    const c = ensure(); if (!c) return;
    const now = c.currentTime;
    const base = [1567, 2093, 2637];
    base.forEach((f, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, now);
      g.gain.setValueAtTime(0.0001, now + i*0.04);
      g.gain.exponentialRampToValueAtTime(0.035, now + i*0.04 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.04 + 0.6);
      o.connect(g).connect(c.destination);
      o.start(now + i*0.04);
      o.stop(now + i*0.04 + 0.7);
    });
  }
  function pang(){
    if (muted) return;
    const c = ensure(); if (!c) return;
    const now = c.currentTime;
    // soft bell
    const fundamentals = [523.25, 1046.5, 1567.98];
    fundamentals.forEach((f, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.10 / (i+1), now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 1.4 + i*0.2);
      o.connect(g).connect(c.destination);
      o.start(now);
      o.stop(now + 1.6 + i*0.2);
    });
    // subtle low warmth
    const lo = c.createOscillator();
    const lg = c.createGain();
    lo.type = 'sine'; lo.frequency.value = 196;
    lg.gain.setValueAtTime(0.0001, now);
    lg.gain.exponentialRampToValueAtTime(0.05, now + 0.05);
    lg.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
    lo.connect(lg).connect(c.destination);
    lo.start(now); lo.stop(now + 1.25);
  }
  function tick(){
    if (muted) return;
    const c = ensure(); if (!c) return;
    const now = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.value = 1760;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.03, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    o.connect(g).connect(c.destination);
    o.start(now); o.stop(now + 0.28);
  }
  return {
    chime, shimmer, pang, tick,
    setMuted(m){ muted = !!m; },
    isMuted(){ return muted; }
  };
})();

(function spawnParticles(){

    p.style.width = size + 'px';

    p.style.animationDelay = (-Math.random() * 30) + 's';
    p.style.opacity = (0.3 + Math.random() * 0.5).toFixed(2);
    wrap.appendChild(p);
  }
})();

/* ============================================================
   SEEDED RANDOM (mulberry32 + hashed string seed)
   ============================================================ */
function hashSeed(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr){
  const seed = hashSeed(seedStr);
  const rnd = mulberry32(seed);
  return {
    next: rnd,
    int(min, max){ return Math.floor(rnd() * (max - min + 1)) + min; },
    pick(arr){ return arr[Math.floor(rnd() * arr.length)]; },
    pickN(arr, n){
      const copy = arr.slice();
      const out = [];
      for (let i = 0; i < n && copy.length; i++){
        const idx = Math.floor(rnd() * copy.length);
        out.push(copy.splice(idx, 1)[0]);
      }
      return out;
    },
    chance(p){ return rnd() < p; }
  };
}

/* ============================================================
   GENERATOR
   ============================================================ */
function formatName(name){
  return (name || "").trim().replace(/\s+/g, ' ').slice(0, 20) || "당신";
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function generateFortune({ name, birth, gender }){
  const cleanName = formatName(name);
  const seedStr = `${cleanName}|${birth}|${gender}|${todayKey()}`;
  const rng = makeRng(seedStr);

  const fill = (s) => s.replace(/\{name\}/g, cleanName);

  const overallSentences = rng.pickN(POOLS.overall, 6).map(fill);
  const loveSentences    = rng.pickN(POOLS.love, 6).map(fill);
  const moneySentences   = rng.pickN(POOLS.money, 5).map(fill);
  const workSentences    = rng.pickN(POOLS.work, 5).map(fill);
  const relationSent     = rng.pickN(POOLS.relation, 5).map(fill);
  const cautionSent      = rng.pickN(POOLS.caution, 5).map(fill);

  const loveScore = 50 + rng.int(-25, 45); // 25-95
  const luckyNum  = rng.int(1, 99);
  const luckyNumExplanations = [
    `오늘의 행운 숫자 ${luckyNum}은 작지만 확실한 전환을 의미합니다.`,
    `숫자 ${luckyNum}은 오늘 당신의 흐름에 조용한 균형을 더해줍니다.`,
    `${luckyNum}이라는 숫자는 ‘한 번 더 들여다보기’의 의미를 가집니다.`,
    `오늘 ${luckyNum}은 미루지 않고 마무리할 일을 가리키는 신호입니다.`,
    `${luckyNum}은 오늘의 안정과 작은 도약 사이의 균형을 상징합니다.`,
    `${luckyNum}은 오늘 새로 만난 정보에 좀 더 귀를 기울이라는 신호입니다.`
  ];
  const numDesc = rng.pick(luckyNumExplanations);

  const color = rng.pick(POOLS.colors);
  const colorDesc = rng.pick(POOLS.color_desc);

  const kwWords = rng.pickN(POOLS.kw_word, 3);
  const kwItems = kwWords.map(w => ({ word: w, desc: POOLS.kw_desc[w] || "오늘의 흐름과 잘 어울리는 단어입니다." }));

  const oneLine = rng.pick(POOLS.oneLiner);

  // Overall score (1-100) — used loosely for tone
  const overallScore = Math.min(99, Math.max(35, 50 + rng.int(-15, 45)));

  return {
    name: cleanName,
    dateLabel: todayLabel(),
    overall: overallSentences.join(' '),
    overallScore,
    love: {
      score: Math.min(99, Math.max(20, loveScore)),
      text: loveSentences.join(' ')
    },
    money: moneySentences.join(' '),
    work: workSentences.join(' '),
    relation: relationSent.join(' '),
    caution: cautionSent.join(' '),
    keywords: kwItems,
    luckyNumber: { value: luckyNum, desc: numDesc },
    luckyColor: { name: color.name, hex: color.hex, desc: colorDesc },
    oneLiner: oneLine
  };
}

/* ============================================================
   RENDERING
   ============================================================ */
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function renderResult(data){
  const root = document.getElementById('resultContent');
  root.innerHTML = '';

  // header
  const header = el(`
    <div class="result-header">
      <div class="burst" aria-hidden="true"></div>

      <p>${escapeHTML(data.dateLabel)}</p>

  root.appendChild(header);

  // Card builder
  const sections = [];

  // 1. 전체운

  // 2. 연애운 with score

            <defs>
              <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">

                <stop offset="60%" stop-color="#d8b673"/>

          </svg>

        </div>

        </div>
      </div>
      <p>${escapeHTML(data.love.text)}</p>
    `
  });

  // 3. 금전운
  sections.push({ tag:"MONEY", title:"오늘의 금전운", body:`<p>${escapeHTML(data.money)}</p>` });
  // 4. 일/작업운
  sections.push({ tag:"WORK", title:"오늘의 일 · 작업운", body:`<p>${escapeHTML(data.work)}</p>` });

  sections.push({ tag:"RELATION", title:"오늘의 인간관계운", body:`<p>${escapeHTML(data.relation)}</p>` });

  // 6. 행운 키워드
  const kwHtml = data.keywords.map(k => `
    <div class="kw-item">
      <div class="kw-word">${escapeHTML(k.word)}</div>
      <div class="kw-desc">${escapeHTML(k.desc)}</div>
    </div>

  sections.push({
    tag:"KEYWORDS",
    title:"오늘의 행운 키워드",

  });

  // 7+8 number + color
  sections.push({
    tag:"LUCK",
    title:"오늘의 행운 숫자 · 색",
    body: `
      <div class="pill-row">
        <div class="pill">
          <div class="pill-label">NUMBER</div>
          <div class="pill-value">${data.luckyNumber.value}</div>
          <div class="pill-desc">${escapeHTML(data.luckyNumber.desc)}</div>

  // Render cards staggered
  sections.forEach((s, i) => {

          <h3 class="card-title">${escapeHTML(s.title)}</h3>
        </div>
        <div class="card-body">${s.body}</div>

  const liner = el(`
    <div class="card one-liner" style="animation-delay:${0.15 + sections.length*0.12}s;">

    </div>
  `);
  root.appendChild(liner);

  // CTA section
  const cta = el(`
    <div class="card cta-section" style="animation-delay:${0.15 + (sections.length+1)*0.12}s;">
      <h3>당신의 행운을 올려줄 행운의 아이템을 구매해보세요!</h3>
      <p>오늘의 키워드와 어울리는 작은 행운의 물건이 흐름을 도와줄 수 있습니다.</p>
      <a class="cta-btn cta-main" href="https://marpple.shop/kr/IO_Grimo" target="_blank" rel="noopener noreferrer">
        행운 아이템 구매 바로가기
      </a>
      <a class="cta-btn cta-insta" href="https://www.instagram.com/io_grimo/" target="_blank" rel="noopener noreferrer">
        IO_Grimo 인스타그램
      </a>
    </div>
  `);
  root.appendChild(cta);

  // actions row
  const actions = el(`
    <div class="actions-row" style="margin-top:16px;">
      <button class="btn btn-ghost" id="btnAgain">다시 보기</button>
      <button class="btn btn-ghost" id="btnHomeFromResult">처음으로</button>
    </div>
    <p class="disclaimer" style="margin-top:14px;">본 운세는 재미와 참고용 콘텐츠입니다.</p>
  `);
  root.appendChild(actions);

  // Animate score circle + count up
  setTimeout(() => {
    const circle = root.querySelector('.score-circle');
    if (circle){
      const score = parseInt(circle.dataset.score, 10);
      const fg = circle.querySelector('.ring-fg');
      const C = 2 * Math.PI * 34;
      fg.style.strokeDashoffset = C * (1 - score/100);

      const numEl = circle.querySelector('.score-num');
      const target = parseInt(numEl.dataset.target, 10);
      animateCount(numEl, 0, target, 1400);
    }
  }, 800);

  // Burst sound
  setTimeout(() => Sound.pang(), 200);
  setTimeout(() => Sound.shimmer(), 700);

  // wire buttons
  document.getElementById('btnAgain').addEventListener('click', () => {
    Sound.tick();
    showScreen('form');
  });
  document.getElementById('btnHomeFromResult').addEventListener('click', () => {
    Sound.tick();
    showScreen('home');
  });
}

function animateCount(node, from, to, duration){
  const startTs = performance.now();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ node.textContent = to; return; }
  function step(ts){
    const t = Math.min(1, (ts - startTs) / duration);
    // easeOutCubic
    const eased = 1 - Math.pow(1 - t, 3);
    const v = Math.round(from + (to - from) * eased);
    node.textContent = v;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   SCREENS / FLOW
   ============================================================ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showLoading(cb){
  const loader = document.getElementById('loading');
  const textNode = document.getElementById('loadingText');
  const messages = [
    "오늘의 흐름을 읽는 중…",
    "당신에게 닿는 운을 정리하는 중…",
    "행운의 방향을 찾는 중…"
  ];
  let idx = 0;
  loader.classList.add('show');
  textNode.textContent = messages[0];
  textNode.style.opacity = '0.95';
  Sound.chime();

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const total = reduce ? 800 : 3000;
  const step  = reduce ? 250 : 950;

  const interval = setInterval(() => {
    idx = (idx + 1) % messages.length;
    textNode.style.opacity = '0';
    setTimeout(() => {
      textNode.textContent = messages[idx];
      textNode.style.opacity = '0.95';
    }, 300);
  }, step);

  setTimeout(() => {
    clearInterval(interval);
    loader.classList.remove('show');
    cb && cb();
  }, total);
}

/* ============================================================
   VALIDATION + WIRE-UP
   ============================================================ */
function validate(){
  const name = document.getElementById('inputName').value.trim();
  const birth = document.getElementById('inputBirth').value;
  const wn = document.getElementById('warnName');
  const wb = document.getElementById('warnBirth');
  wn.textContent = '';
  wb.textContent = '';
  let ok = true;
  if (!name){
    wn.textContent = '이름을 입력해 주세요.';
    ok = false;
  }
  if (!birth){
    wb.textContent = '생년월일을 선택해 주세요.';
    ok = false;
  }
  return ok;
}

function getGender(){
  const r = document.querySelector('input[name="gender"]:checked');
  return r ? r.value : 'none';
}

document.getElementById('btnStart').addEventListener('click', () => {
  Sound.tick();
  showScreen('form');
});
document.getElementById('btnBackHome').addEventListener('click', () => {
  Sound.tick();
  showScreen('home');
});

document.getElementById('btnSubmit').addEventListener('click', () => {
  if (!validate()) return;
  Sound.tick();
  const data = {
    name: document.getElementById('inputName').value,
    birth: document.getElementById('inputBirth').value,
    gender: getGender()
  };
  showScreen('result');
  // empty old result while loading
  document.getElementById('resultContent').innerHTML = '';
  showLoading(() => {
    const result = generateFortune(data);
    renderResult(result);
  });
});

// Mute toggle
const muteBtn = document.getElementById('muteBtn');
const iconSound = document.getElementById('iconSound');
const iconMute = document.getElementById('iconMute');
muteBtn.addEventListener('click', () => {
  const newMuted = !Sound.isMuted();
  Sound.setMuted(newMuted);
  muteBtn.setAttribute('aria-pressed', String(newMuted));
  if (newMuted){
    iconSound.style.display = 'block';
    iconMute.style.display = 'none';
  } else {
    iconSound.style.display = 'none';
    iconMute.style.display = 'block';
    // tiny ack tick
    Sound.tick();
  }
});

// Enter key submit on form fields
['inputName','inputBirth'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      document.getElementById('btnSubmit').click();
    }
  });
});
